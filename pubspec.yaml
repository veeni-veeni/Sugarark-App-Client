name: sugarark_app_client
description: SugarArk 端用户原生 App (会员)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.0.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.0

  # 路由
  go_router: ^14.0.0

  # 安全存储 (sugarark JWT + IM token)
  flutter_secure_storage: ^9.2.2

  # 缓存 (非敏感: 推荐流索引 / 通知本地草稿)
  hive: ^2.2.3
  path_provider: ^2.1.3

  # JSON
  json_annotation: ^4.9.0

  # 图片
  cached_network_image: ^3.3.1

  # 外链 (V1 注册走 Web, 用 deep-link 跳浏览器, App ADR-0003)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # 字体待加 (Cormorant Garamond / Montserrat 文件), V1 用系统 fallback
  # fonts:
  #   - family: Cormorant Garamond
  #     fonts:
  #       - asset: fonts/CormorantGaramond-Regular.ttf
  #   - family: Montserrat
  #     fonts:
  #       - asset: fonts/Montserrat-Regular.ttf
